name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Reject .sql files in the repository root
        run: |
          stray=$(find . -maxdepth 1 -name '*.sql' -printf '%f\n')
          if [ -n "$stray" ]; then
            echo "Schema changes belong in supabase/migrations/, not the repo root:"
            echo "$stray"
            exit 1
          fi

      - name: Apply migrations and assert schema invariants
        run: ./scripts/verify-migrations.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
